name: 成績更新

on:
  schedule:
    - cron: "30 15 * * *" # 毎日 0:30 JST(試合終了後)
    - cron: "0 23 * * *"  # 毎日 8:00 JST(公式の反映が遅れた場合の拾い直し)
  workflow_dispatch:       # Actions画面から手動実行
  push:
    branches: [main]
    paths: [picks.json, events.json]  # 指名・イベントを直したら即再集計

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/update.py
      - name: 変化があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --staged --quiet || (git commit -m "成績更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')" && git push)
