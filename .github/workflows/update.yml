name: 成績更新

on:
  schedule:
    # 毎日 22:47 / 23:47 / 0:47 / 1:47 / 3:47 / 7:47 JST(UTCで指定)
    # GitHubの定時実行は混雑で遅れるため、ちょうどの時刻を避けて複数回動かす。成績に変化がなければコミットしない
    - cron: "47 13,14,15,16,18,22 * * *"
  workflow_dispatch:       # Actions画面から手動実行
  push:
    branches: [main]
    paths: [picks.json, events.json]  # 指名・イベントを直したら即再集計

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/update.py
      - name: 変化があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --staged --quiet || (git commit -m "成績更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')" && git push)
